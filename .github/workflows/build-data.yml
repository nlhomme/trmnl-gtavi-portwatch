name: Build TRMNL data

# TRMNL polls data/trmnl.json (~1 KB) instead of the site's ~200 KB tracker.json.
# The site's scout updates the tracker every 3 hours; checking hourly keeps lag under an hour,
# and a commit happens only when data/trmnl.json changed, i.e. at each site refresh (its `updated` time changes).
# and a commit happens only when data/trmnl.json changed, i.e. at each site refresh (its `updated` time changes).
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: build-data

jobs:
  build:
    runs-on: self-hosted
    steps:
      # No token left in .git/config: check-drift.mjs runs code downloaded from the site,
      # so only the commit step below gets push access.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build data/trmnl.json
        run: node scripts/build-data.mjs

      # Fails (leaving the last good trmnl.json published) if the site changed its scoring.
      - name: Check against the site's scoring.js
        run: node scripts/check-drift.mjs

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet -- data/trmnl.json && { echo "No change."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh TRMNL data" -- data/trmnl.json
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}

  report:
    needs: build
    if: always() && needs.build.result != 'cancelled' && needs.build.result != 'skipped'
    runs-on: self-hosted
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULT: ${{ needs.build.result }}
    steps:
      - name: Open, update or close the failure issue
        run: |
          gh label create workflow-failure --description "The Build TRMNL data workflow is failing" --color d73a4a 2>/dev/null || true
          N=$(gh issue list --label workflow-failure --state open --json number --jq '.[0].number // empty')
          NOW=$(date -u +"%Y-%m-%d %H:%M UTC")
          if [ "$RESULT" = "failure" ]; then
            if [ -n "$N" ]; then
              gh issue comment "$N" --body "Still failing at $NOW: $RUN_URL"
            else
              gh issue create --label workflow-failure --title "Build TRMNL data is failing" \
                --body "The workflow failed at $NOW: $RUN_URL. The display keeps showing the last good data. If the failing step is the drift check, the site changed its scoring and scripts/build-data.mjs must be updated. This issue closes itself when a run succeeds."
            fi
          elif [ -n "$N" ]; then
            gh issue close "$N" --comment "Fixed by $RUN_URL ($NOW)."
          fi
